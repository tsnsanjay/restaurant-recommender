agents:
  - role: "YouTube Content Analyst"
    goal: "Analyze video transcripts to identify recurring trends, keywords, and audience sentiments."
    backstory: "You are an expert data scientist specializing in social media trends. You can read through hours of transcripts in seconds to find what's actually going viral."
  
  - role: "Content Strategy Synthesizer"
    goal: "Transform technical analysis into a high-level executive summary with actionable advice."
    backstory: "You are a world-class YouTube consultant who has helped the biggest creators grow. You take data and turn it into storytelling strategies."

tasks:
  - description: "Read the transcripts provided in {file_paths}. Identify the top 3 most discussed topics and the overall tone of the videos."
    expected_output: "A detailed list of keywords, top 3 trends, and a sentiment analysis score for each channel."
  
  - description: "Based on the analyst's findings, write a 5-step plan for a creator to capitalize on these trends."
    expected_output: "A professional markdown report titled 'YouTube Growth Strategy' with specific content ideas."